<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giseop Kim | Curriculum Vitae</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/web/pdf_viewer.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font: 14px system-ui, sans-serif; color: #203348; background: #e9edf2; }
    .toolbar { position: absolute; inset: 0 0 auto; z-index: 10; min-height: 64px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff; border-bottom: 1px solid #d5dfe8; }
    .title { margin: 0; font-size: 15px; font-weight: 650; white-space: nowrap; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 6px; }
    button, input, .pdf-link { min-height: 34px; border: 1px solid #d5dfe8; border-radius: 6px; font: inherit; color: #0076b3; background: #fff; }
    button, .pdf-link { padding: 6px 10px; cursor: pointer; }
    button:hover, .pdf-link:hover { background: #edf6fb; }
    :focus-visible { outline: 2px solid #0076b3; outline-offset: 2px; }
    button:disabled, input:disabled { opacity: .45; cursor: default; }
    input { width: 48px; text-align: center; color: #203348; }
    .count { min-width: 28px; }
    #zoom-value { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
    .pdf-link { text-decoration: none; white-space: nowrap; }
    .actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    body.embedded .actions { margin-right: 44px; }
    #viewerContainer { position: absolute; inset: var(--toolbar-height, 64px) 0 0; overflow: auto; }
    .pdfViewer .page { margin: 12px auto; box-shadow: 0 2px 12px #20334820; }
    #status { position: absolute; inset: calc(var(--toolbar-height, 64px) + 26px) 16px auto; z-index: 11; text-align: center; padding: 18px; background: #fff; border-radius: 8px; }
    [hidden] { display: none !important; }
    @media (max-width: 620px) {
      .toolbar { min-height: 106px; padding: 8px; flex-wrap: wrap; gap: 7px; }
      .title { width: 100%; }
      .actions { order: 2; }
      body.embedded .actions { margin-right: 0; }
      .toolbar { padding-right: 48px; }
      .controls { margin-right: -40px; width: calc(100% + 40px); }
      .controls { order: 3; gap: 5px; }
      button { padding: 5px 8px; }
    }
  </style>
</head>
<body>
  <header class="toolbar" aria-label="CV viewer controls">
    <h1 class="title">Giseop Kim · CV</h1>
    <div class="controls">
      <button id="previous" type="button" aria-label="Previous page" disabled>‹</button>
      <input id="page-number" type="number" min="1" value="1" aria-label="Page number" disabled />
      <span class="count" id="page-count">/ —</span>
      <button id="next" type="button" aria-label="Next page" disabled>›</button>
      <button id="zoom-out" type="button" aria-label="Zoom out" disabled>−</button>
      <span id="zoom-value">—</span>
      <button id="zoom-in" type="button" aria-label="Zoom in" disabled>+</button>
      <button id="fit" type="button" disabled>Fit width</button>
    </div>
    <div class="actions">
      <a class="pdf-link" href="https://github.com/gisbi-kim/cv-giseopkim" target="_blank" rel="noopener noreferrer">View on GitHub</a>
      <a id="download" class="pdf-link" href="https://raw.githubusercontent.com/gisbi-kim/cv-giseopkim/main/main.pdf" target="_blank" rel="noopener noreferrer">Download PDF</a>
    </div>
  </header>
  <div id="status" role="status" aria-live="polite">Loading CV…</div>
  <div role="main" id="viewerContainer" aria-label="Giseop Kim curriculum vitae" tabindex="0">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <noscript><p>Please enable JavaScript or use the Download PDF link to read the CV.</p></noscript>
  <script type="module">
    if (window.parent !== window) document.body.classList.add("embedded");
    const toolbar = document.querySelector(".toolbar");
    const updateToolbarHeight = () => document.documentElement.style.setProperty("--toolbar-height", toolbar.offsetHeight + "px");
    updateToolbarHeight();
    new ResizeObserver(updateToolbarHeight).observe(toolbar);
    const source = "https://raw.githubusercontent.com/gisbi-kim/cv-giseopkim/main/main.pdf";
    const packageBase = "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/";
    const status = document.getElementById("status");
    const container = document.getElementById("viewerContainer");
    const pageNumber = document.getElementById("page-number");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const zoomOut = document.getElementById("zoom-out");
    const zoomIn = document.getElementById("zoom-in");
    const fit = document.getElementById("fit");
    let downloadUrl;
    function showError(error) {
      console.error("CV preview failed:", error);
      status.textContent = "The CV could not be displayed. Please use Download PDF above.";
      status.hidden = false;
    }
    try {
      const pdfjs = await import(packageBase + "build/pdf.mjs");
      globalThis.pdfjsLib = pdfjs;
      pdfjs.GlobalWorkerOptions.workerSrc = packageBase + "build/pdf.worker.mjs";
      const { EventBus, PDFViewer, PDFLinkService } = await import(packageBase + "web/pdf_viewer.mjs");
      const eventBus = new EventBus();
      const linkService = new PDFLinkService({ eventBus, externalLinkTarget: 2, externalLinkRel: "noopener noreferrer" });
      const viewer = new PDFViewer({ container, eventBus, linkService });
      linkService.setViewer(viewer);
      const syncPage = () => {
        pageNumber.value = String(viewer.currentPageNumber);
        previous.disabled = viewer.currentPageNumber <= 1;
        next.disabled = viewer.currentPageNumber >= viewer.pagesCount;
      };
      eventBus.on("pagesinit", () => {
        viewer.currentScaleValue = "page-width";
        pageNumber.max = String(viewer.pagesCount);
        document.getElementById("page-count").textContent = "/ " + viewer.pagesCount;
        for (const control of [pageNumber, zoomOut, zoomIn, fit]) control.disabled = false;
        syncPage();
      });
      eventBus.on("pagechanging", syncPage);
      eventBus.on("scalechanging", ({ scale }) => {
        document.getElementById("zoom-value").textContent = Math.round(scale * 100) + "%";
        zoomOut.disabled = scale <= .25;
        zoomIn.disabled = scale >= 3;
      });
      eventBus.on("pagerendered", ({ error }) => {
        if (error) showError(error);
        else status.hidden = true;
      });
      previous.addEventListener("click", () => { viewer.currentPageNumber = Math.max(1, viewer.currentPageNumber - 1); });
      next.addEventListener("click", () => { viewer.currentPageNumber = Math.min(viewer.pagesCount, viewer.currentPageNumber + 1); });
      const goToPage = () => {
        const value = Number(pageNumber.value);
        if (Number.isInteger(value) && value >= 1 && value <= viewer.pagesCount) viewer.scrollPageIntoView({ pageNumber: value });
        syncPage();
      };
      pageNumber.addEventListener("change", goToPage);
      pageNumber.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          goToPage();
        }
      });
      zoomOut.addEventListener("click", () => { viewer.currentScale = Math.max(.25, viewer.currentScale / 1.2); });
      zoomIn.addEventListener("click", () => { viewer.currentScale = Math.min(3, viewer.currentScale * 1.2); });
      fit.addEventListener("click", () => { viewer.currentScaleValue = "page-width"; });
      new ResizeObserver(() => {
        if (viewer.pagesCount && viewer.currentScaleValue === "page-width") viewer.currentScaleValue = "page-width";
      }).observe(container);
      const pdf = await pdfjs.getDocument({
        url: source,
        cMapUrl: packageBase + "cmaps/",
        cMapPacked: true,
        standardFontDataUrl: packageBase + "standard_fonts/",
        isEvalSupported: false
      }).promise;
      linkService.setDocument(pdf);
      viewer.setDocument(pdf);
      document.getElementById("download").addEventListener("click", async (event) => {
        event.preventDefault();
        try {
          if (!downloadUrl) downloadUrl = URL.createObjectURL(new Blob([await pdf.getData()], { type: "application/pdf" }));
          const link = document.createElement("a");
          link.href = downloadUrl;
          link.download = "Giseop-Kim-CV.pdf";
          link.click();
        } catch (error) {
          showError(error);
        }
      });
      window.addEventListener("pagehide", () => {
        if (downloadUrl) URL.revokeObjectURL(downloadUrl);
      });
    } catch (error) {
      showError(error);
    }
  </script>
</body>
</html>
