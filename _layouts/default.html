<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}" />
    <link rel="icon" type="image/png" href="{{ '/assets/site/aprl-avatar.png' | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ '/assets/site/aprl-avatar.png' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  </head>
  <body>
    {% include header.html %}
    <script src="{{ '/header-dalgu-continuity.js?v=20260715-random-mode-face' | relative_url }}"></script>
    {{ content }}
    {% include footer.html %}
    {% for script in page.extra_scripts %}
    <script src="{{ script | relative_url }}"></script>
    {% endfor %}
    <script src="{{ '/lightbox.js?v=20260704-image-link-lightbox' | relative_url }}"></script>
    <script src="{{ '/theme-toggle.js?v=20260626' | relative_url }}"></script>
    <script src="{{ '/header-stickiness.js?v=20260718-anchor-release' | relative_url }}"></script>
    <script src="{{ '/nav-toggle.js?v=20260627' | relative_url }}"></script>
    <script src="{{ '/site-search.js?v=20260626' | relative_url }}"></script>
  </body>
</html>
