<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}" />
    <link rel="icon" type="image/png" href="{{ '/assets/site/aprl-avatar.png' | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ '/assets/site/aprl-avatar.png' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  </head>
  <body>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
    {% for script in page.extra_scripts %}
    <script src="{{ script | relative_url }}"></script>
    {% endfor %}
    <script src="{{ '/lightbox.js?v=20260619-publication-figure' | relative_url }}"></script>
  </body>
</html>
