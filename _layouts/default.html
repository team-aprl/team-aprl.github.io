<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}" />
    <link rel="icon" type="image/png" href="{{ site.data.site.lab.logo | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ site.data.site.lab.logo | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/' | append: site.design_theme | append: '.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  </head>
  <body>
    {% include render/header.html %}
    <script src="{{ '/assets/js/core/header-dalgu-continuity.js?v=20260715-random-mode-face' | relative_url }}"></script>
    {{ content }}
    {% include render/footer.html %}
    {% for script in page.extra_scripts %}
    <script src="{{ script | relative_url }}"></script>
    {% endfor %}
    <script src="{{ '/assets/js/core/lightbox.js?v=20260718-team-placeholder-size' | relative_url }}"></script>
    <script src="{{ '/assets/js/core/theme-toggle.js?v=20260626' | relative_url }}"></script>
    <script src="{{ '/assets/js/core/header-stickiness.js?v=20260718-anchor-release' | relative_url }}"></script>
    <script src="{{ '/assets/js/core/nav-toggle.js?v=20260627' | relative_url }}"></script>
    <script src="{{ '/assets/js/core/site-search.js?v=20260626' | relative_url }}"></script>
  </body>
</html>
