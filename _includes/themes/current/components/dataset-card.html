{% assign item = include.item %}<article class="dataset-card"><div class="dataset-card-header"><div><h2><a href="{{ item.website }}">{{ item.title }}</a></h2><p>{{ item.venue }}</p></div><a href="{{ item.website }}">Website</a></div><div class="dataset-image-grid">{% for image in item.images %}<a href="{{ image.href }}"><img src="{{ image.src }}" alt="{{ image.alt | escape }}" loading="lazy" /></a>{% endfor %}</div></article>
