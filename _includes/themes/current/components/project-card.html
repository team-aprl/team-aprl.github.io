{% assign item = include.item %}<article{% unless item.id contains 'project-' %} id="{{ item.id }}"{% endunless %} class="publication-card project-card" data-project-roles="{{ item.roles | join: ' ' }}" data-project-title-ko="{{ item.title_ko | escape }}"><div class="publication-body"><div class="publication-title-row"><span class="pub-badge {% if item.status == 'Current' %}project-current{% else %}project-completed{% endif %}">{{ item.status }}</span><h3>{{ item.title }}</h3></div><div class="publication-meta">{% for meta in item.metadata %}<span{% if meta.content_ko %} data-project-value-ko="{{ meta.content_ko | escape }}"{% endif %}><b>{{ meta.label }}</b>{{ meta.content_html }}</span>{% endfor %}</div></div>{% if item.figure %}<a class="publication-figure" href="{{ item.figure.href }}"><img src="{{ item.figure.src }}" alt="{{ item.figure.alt | escape }}" loading="lazy" /></a>{% endif %}</article>
