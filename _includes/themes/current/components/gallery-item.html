{% assign item = include.item %}<figure{% if item.images.size > 1 %} class="gallery-carousel"{% endif %}>{% if item.images.size > 1 %}<div class="gallery-carousel-stage">{% for image in item.images %}<a class="gallery-carousel-slide{% if forloop.first %} is-active{% endif %}" href="{{ image.href }}"><img src="{{ image.src }}" alt="{{ image.alt | escape }}" loading="lazy" /></a>{% endfor %}<button class="gallery-carousel-button gallery-carousel-prev" type="button" aria-label="Previous photo">&lsaquo;</button><button class="gallery-carousel-button gallery-carousel-next" type="button" aria-label="Next photo">&rsaquo;</button></div>{% else %}{% assign image = item.images.first %}<a href="{{ image.href }}"><img src="{{ image.src }}" alt="{{ image.alt | escape }}" loading="lazy" /></a>{% endif %}<figcaption><span class="gallery-caption-head"><span>{{ item.date }}</span>{% if item.images.size > 1 %}<span class="gallery-carousel-count">1 / {{ item.images.size }}</span>{% endif %}</span><span class="gallery-caption-text">{{ item.description }}</span></figcaption></figure>
