<header class="site-header">
  <div class="institution-bar">
    <div class="header-inner institution-inner">
      <a class="dgist-wordmark" href="https://www.dgist.ac.kr/eng/" target="_blank" rel="noopener noreferrer" data-default-href="https://www.dgist.ac.kr/eng/" data-default-label="Daegu Gyeongbuk Institute of Science &amp; Technology (DGIST)" data-compact-href="{{ '/' | relative_url }}" data-compact-label="Autonomy and Perceptual Robotics Lab (APRL)"><span>Daegu Gyeongbuk Institute of Science &amp; Technology (DGIST)</span></a>
      <div class="institution-actions">
        <form class="site-search" role="search" action="search.html">
          <label class="sr-only" for="site-search-input">Search APRL site</label>
          <input id="site-search-input" type="search" name="q" placeholder="Search" autocomplete="off" />
          <div class="site-search-results" role="listbox" hidden></div>
        </form>
        <a class="header-youtube-link" href="https://www.youtube.com/@APRL-DGIST" target="_blank" rel="noopener noreferrer"><span class="header-youtube-icon" aria-hidden="true"></span>YouTube</a>
        <button class="theme-toggle" type="button" aria-label="Current theme: Light. Switch to dark theme" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">&#9728;</span>
          <span class="theme-toggle-text">Light</span>
        </button>
        <button class="dalgu-mode-toggle" type="button" aria-label="Change Dalgu mode" title="Change Dalgu mode">
          <span class="dalgu-mode-toggle-face" aria-hidden="true">
            <img src="{{ '/assets/site/thumbs/dalgu-front-thumb.webp' | relative_url }}" alt="" width="128" height="120" loading="eager" decoding="async" />
          </span>
        </button>
        <button class="dalgu-skin-toggle" type="button" aria-label="Show the next Dalgu scenery" title="Next Dalgu scenery">
          <span class="dalgu-skin-toggle-orb" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
  <div class="header-inner lab-header">
    <div class="header-dalgu-scenery-track" aria-hidden="true">
      <div class="header-dalgu-scenery">
        <span class="header-dalgu-garden-stars"></span>
        <span class="header-dalgu-sprout header-dalgu-sprout-1"></span>
        <span class="header-dalgu-sprout header-dalgu-sprout-2"></span>
        <span class="header-dalgu-sprout header-dalgu-sprout-3"></span>
        <span class="header-dalgu-sprout header-dalgu-sprout-4"></span>
        <span class="header-dalgu-tree header-dalgu-tree-1"></span>
        <span class="header-dalgu-tree header-dalgu-tree-2"></span>
        <span class="header-dalgu-tree header-dalgu-tree-3"></span>
        <span class="header-dalgu-tree header-dalgu-tree-4"></span>
        <span class="header-dalgu-shrub header-dalgu-shrub-1"></span>
        <span class="header-dalgu-shrub header-dalgu-shrub-2"></span>
        <span class="header-dalgu-shrub header-dalgu-shrub-3"></span>
        <span class="header-dalgu-shrub header-dalgu-shrub-4"></span>
        <span class="header-dalgu-flower header-dalgu-flower-1"></span>
        <span class="header-dalgu-flower header-dalgu-flower-2"></span>
        <span class="header-dalgu-flower header-dalgu-flower-3"></span>
        <span class="header-dalgu-flower header-dalgu-flower-4"></span>
        <span class="header-dalgu-garden-rock header-dalgu-garden-rock-1"></span>
        <span class="header-dalgu-garden-rock header-dalgu-garden-rock-2"></span>
        <span class="header-dalgu-mars-ridge header-dalgu-mars-ridge-1"></span>
        <span class="header-dalgu-mars-ridge header-dalgu-mars-ridge-2"></span>
        <span class="header-dalgu-mars-rock header-dalgu-mars-rock-1"></span>
        <span class="header-dalgu-mars-rock header-dalgu-mars-rock-2"></span>
        <span class="header-dalgu-city-building header-dalgu-city-house header-dalgu-city-building-1"></span>
        <span class="header-dalgu-city-tree header-dalgu-city-tree-1"></span>
        <span class="header-dalgu-city-shop header-dalgu-city-shop-1"></span>
        <span class="header-dalgu-city-building header-dalgu-city-midrise header-dalgu-city-building-2"></span>
        <span class="header-dalgu-city-tree header-dalgu-city-tree-2"></span>
        <span class="header-dalgu-city-building header-dalgu-city-office header-dalgu-city-building-3"></span>
        <span class="header-dalgu-city-building header-dalgu-city-office header-dalgu-city-building-4"></span>
        <span class="header-dalgu-city-tree header-dalgu-city-tree-3"></span>
        <span class="header-dalgu-city-building header-dalgu-city-midrise header-dalgu-city-building-5"></span>
        <span class="header-dalgu-city-shop header-dalgu-city-shop-2"></span>
        <span class="header-dalgu-city-tree header-dalgu-city-tree-4"></span>
        <span class="header-dalgu-city-building header-dalgu-city-house header-dalgu-city-building-6"></span>
        <span class="header-dalgu-city-lamp header-dalgu-city-lamp-1"></span>
        <span class="header-dalgu-city-lamp header-dalgu-city-lamp-2"></span>
      </div>
    </div>
    <div class="header-dalgu-track" aria-hidden="true">
      <div class="header-dalgu">
        <picture>
          <source class="header-dalgu-source" srcset="{{ '/assets/site/dalgu-walk.webp' | relative_url }}" type="image/webp" />
          <img class="header-dalgu-image" src="{{ '/assets/site/thumbs/dalgu-walk-fallback-thumb.webp' | relative_url }}" alt="" width="128" height="128" loading="eager" decoding="async" />
        </picture>
      </div>
    </div>
    <div class="lab-mark">
      <a class="lab-logo-link" href="{{ '/assets/site/aprl-avatar.png' | relative_url }}" aria-label="View APRL logo"><img src="{{ '/assets/site/thumbs/aprl-avatar-thumb.webp' | relative_url }}" alt="APRL logo" width="256" height="256" loading="eager" decoding="async" /></a>
      <div class="lab-title-block">
        <a class="lab-title-link" href="{{ '/' | relative_url }}"><strong>Autonomy and Perceptual Robotics Lab (APRL)</strong></a>
        <a class="lab-department-link" href="https://www.dgist.ac.kr/robot/" target="_blank" rel="noopener noreferrer"><small>DGIST Robotics and Mechatronics Engineering</small></a>
      </div>
    </div>
  </div>
  <button class="header-inner nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
    <span class="nav-toggle-icon" aria-hidden="true"></span>
    <span>Menu</span>
  </button>
  <nav class="header-inner primary-nav" id="primary-navigation" aria-label="Primary navigation">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/team.html' | relative_url }}"{% if page.url == '/team.html' %} aria-current="page"{% endif %}>Team</a>
    <a href="{{ '/news.html' | relative_url }}"{% if page.url == '/news.html' %} aria-current="page"{% endif %}>News</a>
    <a href="{{ '/research.html' | relative_url }}"{% if page.url == '/research.html' %} aria-current="page"{% endif %}>Research</a>
    <a href="{{ '/publications.html' | relative_url }}"{% if page.url == '/publications.html' %} aria-current="page"{% endif %}>Publications</a>
    <a href="{{ '/projects.html' | relative_url }}"{% if page.url == '/projects.html' %} aria-current="page"{% endif %}>Projects</a>
    <a href="{{ '/teaching.html' | relative_url }}"{% if page.url == '/teaching.html' %} aria-current="page"{% endif %}>Teaching</a>
    <a href="{{ '/datasets.html' | relative_url }}"{% if page.url == '/datasets.html' %} aria-current="page"{% endif %}>Datasets</a>
    <a href="{{ '/gallery.html' | relative_url }}"{% if page.url == '/gallery.html' %} aria-current="page"{% endif %}>Gallery</a>
    <a href="{{ '/contact.html' | relative_url }}"{% if page.url == '/contact.html' %} aria-current="page"{% endif %}>Contact</a>
    <a class="primary-nav-join" href="{{ '/joining-aprl.html' | relative_url }}"{% if page.url == '/joining-aprl.html' %} aria-current="page"{% endif %}>Joining APRL</a>
  </nav>
</header>
